name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.96.0
  CARGO_TERM_COLOR: always
  TERM: xterm-256color
  NO_COLOR: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt
      - name: Remap Windows build paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $flags = "-C target-feature=+crt-static --remap-path-prefix=$env:GITHUB_WORKSPACE=. --remap-path-prefix=$env:USERPROFILE=home"
          "RUSTFLAGS=$flags" >> $env:GITHUB_ENV
      - name: Remap macOS build paths
        if: runner.os == 'macOS'
        run: echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$HOME=home" >> "$GITHUB_ENV"
      - name: Formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Build production executable
        run: cargo build --locked --release
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist | Out-Null
          $executable = 'codex-provider-switcher.exe'
          Copy-Item "target/release/$executable" -Destination dist
          & "./dist/$executable" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash "dist/$executable" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $executable" | Set-Content "dist/$executable.sha256" -Encoding ascii
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release --target "$target"
          done
          mkdir -p dist target/package-root
          lipo -create target/aarch64-apple-darwin/release/codex-provider-switcher \
            target/x86_64-apple-darwin/release/codex-provider-switcher \
            -output target/package-root/codex-provider-switcher
          chmod 755 target/package-root/codex-provider-switcher
          lipo target/package-root/codex-provider-switcher -verify_arch arm64 x86_64
          version=$(awk -F '"' '/^version = / {print $2; exit}' Cargo.toml)
          pkgbuild --root target/package-root --identifier io.github.embogomolov.codex-provider-switcher \
            --version "$version" --install-location /usr/local/bin --ownership recommended \
            dist/codex-provider-switcher-macos-universal.pkg
          sudo installer -pkg dist/codex-provider-switcher-macos-universal.pkg -target /
          cmp target/package-root/codex-provider-switcher /usr/local/bin/codex-provider-switcher
          zsh -lc 'codex-provider-switcher --help'
          cd dist
          shasum -a 256 codex-provider-switcher-macos-universal.pkg > codex-provider-switcher-macos-universal.pkg.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.pkg
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Prepare draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(awk -F '"' '/^version = / {print $2; exit}' Cargo.toml)
          [ "$RELEASE_TAG" = "v$version" ] || { echo 'Tag must match Cargo version'; exit 1; }
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "$RELEASE_TAG" --notes "Windows x64 executable and macOS universal installer. On macOS, run codex-provider-switcher in Terminal after installation. The macOS installer is unsigned and not notarized. SHA-256 checksums are included."
